version: "3.9"

name: token-transfer-monitor

services:
  postgres:
    image: postgres:16
    container_name: ttm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttm}
      POSTGRES_USER: ${POSTGRES_USER:-ttm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttm_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5434"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ttm} -d ${POSTGRES_DB:-ttm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ttm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ttm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ttm_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data: